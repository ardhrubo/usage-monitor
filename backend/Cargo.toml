[package]
name = "usage_monitor"
version = "1.0.0"
edition = "2021"

[lib]
name = "usage_monitor"
crate-type = ["cdylib"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.51", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
glib = "0.18"
gio = "0.18"

[dev-dependencies]
criterion = "0.5"

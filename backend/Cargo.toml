[package]
name = "usage-monitor"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "usage-monitor"
path = "src/main.rs"

[lib]
name = "usage_monitor"
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4"] }
url = "2.5"
rusqlite = { version = "0.31", features = ["bundled"] }
log = "0.4"
env_logger = "0.10"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_LibraryLoader"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
